<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Orders - DESIGNER</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      min-height: 100vh;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    .container {
      width: 900px;
      max-width: 92%;
      margin: 35px auto;
    }

    h1 {
      margin-bottom: 25px;
    }

    .order-card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .order-id {
      font-weight: bold;
    }

    .status {
      font-weight: bold;
    }

    .details {
      color: #555;
      line-height: 1.8;
      margin-bottom: 15px;
    }

    .track-btn {
      display: inline-block;
      padding: 10px 17px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 7px;
      font-weight: bold;
    }

    .empty {
      background: white;
      padding: 35px;
      border-radius: 12px;
      text-align: center;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    DESIGNER
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="account.html">Profile</a>
    <a href="tracking.html">Track Order</a>
  </nav>

</header>


<div class="container">

  <h1>My Orders</h1>

  <div id="ordersContainer">

    <div class="loading">
      Loading your orders...
    </div>

  </div>

</div>



<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  const firebaseConfig = {

    apiKey: "AIzaSyCn31gZSJVbqwvaynLjgN3UG2LQnJBUQ1g",

    authDomain: "designer-2adf7.firebaseapp.com",

    projectId: "designer-2adf7",

    storageBucket: "designer-2adf7.firebasestorage.app",

    messagingSenderId: "881475406678",

    appId: "1:881475406678:web:6786a0e63f8b21a87564f7",

    measurementId: "G-SWZE9D4Z0H"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  onAuthStateChanged(auth, async (user) => {

    if (!user) {

      window.location.href = "login.html";

      return;

    }


    await loadOrders(user.uid);

  });



  async function loadOrders(uid) {

    const container =
      document.getElementById("ordersContainer");


    try {

      const ordersQuery = query(

        collection(db, "orders"),

        where("userId", "==", uid)

      );


      const snapshot =
        await getDocs(ordersQuery);


      if (snapshot.empty) {

        container.innerHTML = `
          <div class="empty">
            <h2>No orders yet</h2>
            <p style="margin-top:10px;">
              Your previous orders will appear here.
            </p>
          </div>
        `;

        return;

      }


      const orders = [];


      snapshot.forEach((doc) => {

        orders.push({

          id: doc.id,

          ...doc.data()

        });

      });


      // Newest orders first

      orders.sort((a, b) => {

        const dateA =
          a.date?.seconds || 0;

        const dateB =
          b.date?.seconds || 0;

        return dateB - dateA;

      });


      container.innerHTML = "";


      orders.forEach((order) => {

        const date =
          formatDate(order.date);


        const products =
          formatProducts(order.products);


        const card =
          document.createElement("div");

        card.className = "order-card";


        card.innerHTML = `

          <div class="order-header">

            <div class="order-id">
              Order ID: ${escapeHtml(order.id)}
            </div>

            <div class="status">
              ${escapeHtml(order.status || "Order Received")}
            </div>

          </div>


          <div class="details">

            <div>
              <strong>Date:</strong>
              ${date}
            </div>

            <div>
              <strong>Products:</strong>
              ${products}
            </div>

            <div>
              <strong>Total:</strong>
              ₹${Number(order.total || 0).toLocaleString("en-IN")}
            </div>

            <div>
              <strong>Payment:</strong>
              ${escapeHtml(order.paymentMethod || "Cash on Delivery")}
            </div>

            ${
              order.expectedDelivery
              ?
              `
              <div>
                <strong>Expected Delivery:</strong>
                ${formatDate(order.expectedDelivery)}
              </div>
              `
              :
              ""
            }

          </div>


          <a
            href="tracking.html"
            class="track-btn"
          >
            🚚 Track Order
          </a>

        `;


        container.appendChild(card);

      });

    }

    catch (error) {

      console.error(error);

      container.innerHTML = `
        <div class="empty">
          <h2>Unable to load orders</h2>
          <p style="margin-top:10px;">
            Please try again later.
          </p>
        </div>
      `;

    }

  }



  function formatDate(value) {

    if (!value) return "Not available";


    let date;


    if (value.seconds) {

      date =
        new Date(value.seconds * 1000);

    }

    else {

      date =
        new Date(value);

    }


    if (isNaN(date.getTime())) {

      return "Not available";

    }


    return date.toLocaleDateString(
      "en-IN",
      {
        day: "2-digit",
        month: "short",
        year: "numeric"
      }
    );

  }



  function formatProducts(products) {

    if (!products) {

      return "Order items";

    }


    if (Array.isArray(products)) {

      return products
        .map(item => {

          if (typeof item === "string") {

            return escapeHtml(item);

          }

          return escapeHtml(
            item.name || "Product"
          );

        })
        .join(", ");

    }


    return escapeHtml(
      String(products)
    );

  }



  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

</script>

</body>
</html>
