<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - DESIGNER</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      width: 400px;
      max-width: 92%;
      background: white;
      padding: 35px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      width: 50%;
      padding: 12px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      color: #777;
    }

    .tab.active {
      color: #111;
      border-bottom: 2px solid #111;
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #111;
    }

    .main-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .main-btn:hover {
      background: #333;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: -7px;
      margin-bottom: 15px;
      color: #555;
      font-size: 13px;
      cursor: pointer;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #111;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      DESIGNER
    </div>

    <div class="subtitle">
      Your fashion, your account
    </div>


    <!-- TABS -->

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        onclick="showLogin()"
      >
        Login
      </button>

      <button
        class="tab"
        id="signupTab"
        onclick="showSignup()"
      >
        Create Account
      </button>

    </div>


    <!-- ========================= -->
    <!-- LOGIN FORM -->
    <!-- ========================= -->

    <div
      id="loginSection"
      class="form-section active"
    >

      <label>Email Address</label>

      <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
        autocomplete="email"
      >


      <label>Password</label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
        autocomplete="current-password"
      >


      <span
        class="forgot"
        onclick="forgotPassword()"
      >
        Forgot Password?
      </span>


      <button
        class="main-btn"
        id="loginButton"
        onclick="loginUser()"
      >
        Login
      </button>

    </div>


    <!-- ========================= -->
    <!-- SIGN UP FORM -->
    <!-- ========================= -->

    <div
      id="signupSection"
      class="form-section"
    >

      <label>Full Name</label>

      <input
        type="text"
        id="signupName"
        placeholder="Enter your full name"
        autocomplete="name"
      >


      <label>Email Address</label>

      <input
        type="email"
        id="signupEmail"
        placeholder="Enter your email"
        autocomplete="email"
      >


      <label>Password</label>

      <input
        type="password"
        id="signupPassword"
        placeholder="Create a password"
        autocomplete="new-password"
      >


      <label>Confirm Password</label>

      <input
        type="password"
        id="signupConfirmPassword"
        placeholder="Confirm your password"
        autocomplete="new-password"
      >


      <button
        class="main-btn"
        id="signupButton"
        onclick="createAccount()"
      >
        Create Account
      </button>

    </div>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- BACK -->

    <a
      href="index.html"
      class="back"
    >
      ← Continue Shopping
    </a>

  </div>



  <!-- ================================================= -->
  <!-- FIREBASE -->
  <!-- ================================================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



    // =================================================
    // FIREBASE CONFIG
    // =================================================

    const firebaseConfig = {

      apiKey: "AIzaSyCn31gZSJVbqwvaynLjgN3UG2LQnJBUQ1g",

      authDomain: "designer-2adf7.firebaseapp.com",

      projectId: "designer-2adf7",

      storageBucket: "designer-2adf7.firebasestorage.app",

      messagingSenderId: "881475406678",

      appId: "1:881475406678:web:6786a0e63f8b21a87564f7",

      measurementId: "G-SWZE9D4Z0H"

    };


    // =================================================
    // INITIALIZE FIREBASE
    // =================================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);



    // =================================================
    // MESSAGE FUNCTION
    // =================================================

    function showMessage(message, error = false) {

      const messageBox =
        document.getElementById("message");

      messageBox.innerText = message;

      messageBox.style.color =
        error ? "red" : "#555";

    }



    // =================================================
    // SHOW LOGIN
    // =================================================

    window.showLogin = function() {

      document
        .getElementById("loginSection")
        .classList.add("active");

      document
        .getElementById("signupSection")
        .classList.remove("active");


      document
        .getElementById("loginTab")
        .classList.add("active");

      document
        .getElementById("signupTab")
        .classList.remove("active");


      showMessage("");

    };



    // =================================================
    // SHOW SIGNUP
    // =================================================

    window.showSignup = function() {

      document
        .getElementById("signupSection")
        .classList.add("active");

      document
        .getElementById("loginSection")
        .classList.remove("active");


      document
        .getElementById("signupTab")
        .classList.add("active");

      document
        .getElementById("loginTab")
        .classList.remove("active");


      showMessage("");

    };



    // =================================================
    // CREATE ACCOUNT
    // =================================================

    window.createAccount = async function() {

      const name =
        document
          .getElementById("signupName")
          .value
          .trim();


      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("signupPassword")
          .value;


      const confirmPassword =
        document
          .getElementById("signupConfirmPassword")
          .value;


      // Check name

      if (!name) {

        showMessage(
          "Please enter your name.",
          true
        );

        return;

      }


      // Check email

      if (!email) {

        showMessage(
          "Please enter your email.",
          true
        );

        return;

      }


      // Check password

      if (!password) {

        showMessage(
          "Please enter a password.",
          true
        );

        return;

      }


      // Password length

      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          true
        );

        return;

      }


      // Confirm password

      if (password !== confirmPassword) {

        showMessage(
          "Passwords do not match.",
          true
        );

        return;

      }


      try {

        document
          .getElementById("signupButton")
          .classList.add("loading");


        showMessage(
          "Creating your account..."
        );


        // Create Firebase user

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        // Save customer profile in Firestore

        await setDoc(
          doc(db, "users", user.uid),
          {

            uid: user.uid,

            name: name,

            email: email,

            phone: "",

            address: "",

            city: "",

            pincode: "",

            createdAt: serverTimestamp()

          }
        );


        // Save basic local information

        localStorage.setItem(
          "designerUser",
          JSON.stringify({

            uid: user.uid,

            name: name,

            email: email

          })
        );


        showMessage(
          "Account created successfully!"
        );


        // Go to account page

        setTimeout(function() {

          window.location.href =
            "account.html";

        }, 1000);

      }


      catch (error) {

        console.error(error);


        let errorMessage =
          "Unable to create account.";


        if (
          error.code ===
          "auth/email-already-in-use"
        ) {

          errorMessage =
            "This email is already registered. Please login.";

        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          errorMessage =
            "Please enter a valid email address.";

        }

        else if (
          error.code ===
          "auth/weak-password"
        ) {

          errorMessage =
            "Password is too weak.";

        }


        showMessage(
          errorMessage,
          true
        );

      }


      finally {

        document
          .getElementById("signupButton")
          .classList.remove("loading");

      }

    };



    // =================================================
    // LOGIN
    // =================================================

    window.loginUser = async function() {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("loginPassword")
          .value;


      if (!email) {

        showMessage(
          "Please enter your email.",
          true
        );

        return;

      }


      if (!password) {

        showMessage(
          "Please enter your password.",
          true
        );

        return;

      }


      try {

        document
          .getElementById("loginButton")
          .classList.add("loading");


        showMessage(
          "Logging in..."
        );


        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        localStorage.setItem(
          "designerUser",
          JSON.stringify({

            uid: user.uid,

            name: user.displayName || "",

            email: user.email

          })
        );


        showMessage(
          "Login successful! Redirecting..."
        );


        setTimeout(function() {

          window.location.href =
            "account.html";

        }, 800);

      }


      catch (error) {

        console.error(error);


        let errorMessage =
          "Login failed.";


        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          errorMessage =
            "Incorrect email or password.";

        }

        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          errorMessage =
            "No account found with this email.";

        }

        else if (
          error.code ===
          "auth/wrong-password"
        ) {

          errorMessage =
            "Incorrect password.";

        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          errorMessage =
            "Please enter a valid email.";

        }


        showMessage(
          errorMessage,
          true
        );

      }


      finally {

        document
          .getElementById("loginButton")
          .classList.remove("loading");

      }

    };



    // =================================================
    // FORGOT PASSWORD
    // =================================================

    window.forgotPassword = async function() {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();


      if (!email) {

        showMessage(
          "Enter your email first, then click Forgot Password.",
          true
        );

        return;

      }


      try {

        await sendPasswordResetEmail(
          auth,
          email
        );


        showMessage(
          "Password reset email sent. Check your inbox."
        );

      }


      catch (error) {

        console.error(error);


        showMessage(
          "Could not send password reset email.",
          true
        );

      }

    };



    // =================================================
    // CHECK CURRENT LOGIN
    // =================================================

    onAuthStateChanged(
      auth,
      function(user) {

        if (user) {

          console.log(
            "Logged in user:",
            user.uid
          );

        }

      }
    );

  </script>

</body>
</html>
